name: Update Kodi Playlist and EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kodi-epg-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build English-first playlist
        run: python scripts/build.py playlist
      - name: Download latest IPTV-org EPG tool
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: epg
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install EPG tool
        working-directory: epg
        run: npm ci
      - name: Find supported channel matches
        run: python scripts/build.py prepare
      - name: Download matching programme listings by source
        shell: bash
        run: |
          mkdir -p work/guides
          shopt -s nullglob
          for file in work/*.channels.xml; do
            source=$(basename "$file" .channels.xml)
            echo "---- $source ----"
            # A failed provider must not prevent other providers from completing.
            timeout 750s bash -c 'cd epg && npm run grab -- --channels="../'$file'" --days=3 --maxConnections=2 --timeout=15000 --output="../work/guides/'$source'.xml"' || echo "Provider $source unavailable"
          done
      - name: Merge EPG and calculate channel coverage
        run: python scripts/build.py merge
      - name: Check published files
        run: |
          test -s public/channels.m3u
          test -s public/guide.xml
          test -s public/status.json
          test -s public/coverage.csv
          test -s public/index.html
          ls -lh public/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
